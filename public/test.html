<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headless WMS · Test drive</title>
<style>
  :root {
    --app: hsl(42 25% 80%);
    --panel: hsl(42 33% 85%);
    --ink: hsl(42 39% 11%);
    --muted: hsl(42 9% 32%);
    --border: hsl(42 9% 33% / 50%);
    --control-border: hsl(42 12% 33%);
    --input: hsl(42 20% 98%);
    --control: hsl(42 14% 96%);
    --accent: hsl(42 87% 33%);
    --selected: hsl(42 66% 75%);
    --gold: linear-gradient(hsl(42 72% 78%), hsl(42 55% 43%));
    --gold-border: hsl(42 35% 28%);
    --highlight: inset 0 1px 0 hsl(42 85% 92% / 72%);
  }
  * { box-sizing: border-box }
  body { margin: 0; color: var(--ink); background: var(--app); font: 15px/1.45 "Inter", system-ui, sans-serif }
  header { height: 64px; padding: 0 24px 0 0; background: hsl(42 45% 14%) url("./trumpoot_titlebar_b.png") center / 100% 100%; display: flex; align-items: center; gap: 14px }
  .header-icon { display: block; height: 100%; width: auto }
  h1 { margin: 0; font-size: 19px }
  header > span { color: var(--ink) }
  header nav { display: flex; gap: 8px; margin-left: auto }
  header nav button { width: auto; white-space: nowrap }
  main { display: grid; grid-template-columns: clamp(258px, 25%, 350px) minmax(0, 1fr); height: calc(100dvh - 64px) }
  aside { overflow: auto; background: var(--panel); border-right: 1px solid var(--border) }
  form { padding: 18px }
  fieldset { min-width: 0; margin: 17px 0 0; padding: 10px 0 0; border: 0; border-top: 1px solid var(--border) }
  legend { padding-right: 8px; font-weight: 700 }
  label { display: grid; gap: 4px; margin-bottom: 9px; font-size: 13px }
  fieldset label { grid-template-columns: minmax(0, 1fr) minmax(0, 42%); align-items: start; gap: 8px }
  label span { display: grid; gap: 2px; overflow-wrap: anywhere }
  small { color: var(--muted); font: 11px ui-monospace, monospace }
  input, select, button { width: 100%; min-width: 0; font: inherit; padding: 7px 9px; border: 1px solid var(--control-border); border-radius: 5px; background: var(--input); color: inherit }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
  button { background: var(--gold); border-color: var(--gold-border); box-shadow: var(--highlight); color: black; cursor: pointer; font-weight: 650 }
  button:hover { background: var(--selected) }
  button:disabled { background: linear-gradient(hsl(42 18% 74%), hsl(42 14% 54%)); color: hsl(42 12% 30%); cursor: wait }
  .submit { position: sticky; bottom: 0; background: var(--panel); padding: 10px 0 4px }
  section { display: flex; flex-direction: column; min-height: 0; background: var(--app) }
  .bar { min-height: 45px; display: flex; align-items: center; gap: 12px; justify-content: space-between; padding: 8px 18px; background: var(--panel); border-bottom: 1px solid var(--border) }
  .bar p { margin: 0; overflow-wrap: anywhere } a { color: hsl(32 95% 29%); white-space: nowrap }
  iframe { width: 100%; flex: 1; min-height: 0; border: 0 }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(0, min(100%, 400px))); align-content: start; gap: 14px; padding: 18px; overflow: auto }
  .gallery button { display: grid; gap: 8px; align-content: start; color: var(--ink); background: #C9B17A; text-align: center; overflow-wrap: anywhere }
  .gallery-caption { display: grid; justify-items: center; gap: 2px }
  .gallery-dimensions { font-size: 80%; font-weight: 400 }
  .gallery button:hover { border-color: var(--accent) }
  .gallery button[aria-pressed="true"] { border-color: var(--gold-border); color: var(--ink); background: hsl(42 55% 58%) url("./trumpoot_titlebar_b.png") center / 100% 100% }
  .gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #E8E1D1; border: 1px solid var(--border) }
  [hidden] { display: none !important }
  .empty { margin: auto; padding: 20px; text-align: center; color: var(--muted) }
  @media (max-width: 650px) {
    header { height: auto; min-height: 64px; flex-wrap: wrap; padding: 8px 12px; gap: 8px }
    .header-icon { height: 40px }
    header > span { display: none }
    header nav { flex-wrap: wrap }
    main { display: block; height: auto } aside { border-right: 0 } section { height: 75vh }
  }
</style>
<header>
  <img class="header-icon" src="./trumpoot_titlebar_a.png" width="171" height="98" alt="Trumpoot">
  <h1>Headless WMS</h1><span>Test drive</span>
  <nav aria-label="Preview tools">
    <button type="button" id="show-templates" aria-controls="gallery" aria-expanded="false">Templates</button>
    <button type="button" data-help="/help">Full Help</button>
    <button type="button" data-help="/url">URL Help</button>
  </nav>
</header>
<main>
  <aside aria-label="Render settings">
    <form id="settings" novalidate>
      <label id="renderer-choice" hidden>
        Renderer
        <select id="renderer"><option value="http://127.0.0.1:8787/render">Local (port 8787)</option><option value="https://wmsh-ts.trumpoot.workers.dev/render">Live (Cloudflare)</option></select>
      </label>
      <label>
        Map image (JPEG, PNG, or WebP)
        <input type="file" id="image" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" required>
      </label>
      <label>
        <span>Title <small>title</small></span>
        <input name="title" value="TTRPG Battle Map" required>
      </label>
      <label>
        <span>Template <small>template</small></span>
        <input name="template" value="Default" required>
      </label>
      <label>
        <span>Overview <small>overview</small></span>
        <select name="overview"><option value="0">Off</option><option value="1" selected>On</option></select>
      </label>
      <fieldset>
        <legend>Map</legend>
        <label>
          <span>worldWidthFeet <small>wid</small></span>
          <input name="wid" value="160" type="number" step="any" required>
        </label>
      </fieldset>
      <fieldset>
        <legend>Grid</legend>
        <label>
          <span>grid.style <small>gstyle</small></span>
          <select name="gstyle"><option value="rect">Rect</option><option value="hex">Hex</option></select>
        </label>
        <label>
          <span>grid.iso <small>giso</small></span>
          <select name="giso"><option value="false">Off</option><option value="true">On</option></select>
        </label>
        <label>
          <span>grid.isoAngleDegrees <small>gangle</small></span>
          <input name="gangle" value="" type="number" min="15" max="90" step="5" placeholder="15–90">
        </label>
        <label>
          <span>grid.rotationDegrees <small>grot</small></span>
          <input name="grot" value="0" type="number" min="-180" max="180" step="5" required>
        </label>
        <label>
          <span>grid.offsetX <small>gx</small></span>
          <input name="gx" value="0" type="number" min="-1" max="1" step="0.1" required>
        </label>
        <label>
          <span>grid.offsetY <small>gy</small></span>
          <input name="gy" value="0" type="number" min="-1" max="1" step="0.1" required>
        </label>
        <label>
          <span>grid.inchesPerFiveFeet <small>gscale</small></span>
          <input name="gscale" value="1" type="number" min="0.4" max="3" step="0.1" required>
        </label>
        <label>
          <span>grid.lineStyle <small>gline</small></span>
          <select name="gline"><option selected>solid</option><option>none</option><option>dash-1</option><option>dash-2</option><option>dash-3</option><option>dash-4</option><option>dash-5</option><option>dash-6</option><option>dash-8</option><option>dash-10</option><option>dash-16</option><option>corners</option></select>
        </label>
        <label>
          <span>grid.color <small>gcolor</small></span>
          <select name="gcolor"><option selected>black</option><option>gray</option><option>white</option><option>diff</option><option>contrast</option></select>
        </label>
        <label>
          <span>grid.lineWidthPoints <small>gpt</small></span>
          <input name="gpt" value="2.5" type="number" min="0.5" max="10" step="0.5" required>
        </label>
        <label>
          <span>grid.opacity <small>gopacity</small></span>
          <input name="gopacity" value="0.6" type="number" min="0" max="1" step="0.1" required>
        </label>
      </fieldset>
      <fieldset>
        <legend>Paper</legend>
        <label>
          <span>page.size <small>psize</small></span>
          <select name="psize"><option>letter</option><option selected>ledger</option></select>
        </label>
        <label>
          <span>page.orientation <small>porient</small></span>
          <select name="porient"><option>portrait</option><option selected>landscape</option></select>
        </label>
        <label>
          <span>page.rows <small>pr</small></span>
          <input name="pr" value="2" type="number" min="0" max="5" step="1" required>
        </label>
        <label>
          <span>page.columns <small>pc</small></span>
          <input name="pc" value="2" type="number" min="0" max="5" step="1" required>
        </label>
        <label>
          <span>page.marginInches <small>pmargin</small></span>
          <input name="pmargin" value="0.25" type="number" min="0" max="0.5" step="0.05" required>
        </label>
        <label>
          <span>page.overlapInches <small>poverlap</small></span>
          <input name="poverlap" value="0.125" type="number" min="0" max="0.5" step="0.05" required>
        </label>
      </fieldset>
      <div class="submit"><button>Render PDF</button></div>
    </form>
  </aside>
  <section aria-label="Preview and documentation">
    <div class="bar"><p id="status" role="status">PDF preview</p><a id="download" download="map.pdf" hidden>Download PDF</a></div>
    <p id="empty" class="empty">Choose an image and select Render PDF.</p>
    <iframe id="preview" title="Rendered map PDF" hidden></iframe>
    <div id="gallery" class="gallery" aria-label="Saved templates" hidden></div>
  </section>
</main>
<script>
  const form = document.querySelector("#settings");
  const status = document.querySelector("#status");
  const preview = document.querySelector("#preview");
  const download = document.querySelector("#download");
  const gallery = document.querySelector("#gallery");
  const templateButton = document.querySelector("#show-templates");
  const button = form.querySelector("button");
  const iso = form.elements.giso;
  const angle = form.elements.gangle;
  let pdfUrl;
  const renderer = document.querySelector("#renderer");
  const openedFromDisk = location.protocol === "file:";
  document.querySelector("#renderer-choice").hidden = !openedFromDisk;
  const renderEndpoint = () => openedFromDisk ? renderer.value : new URL("/render", location.origin).href;
  const empty = document.querySelector("#empty");
  let galleryRequest;
  let loadedValues = {};
  const settingsSnapshot = () => JSON.stringify([...form.querySelectorAll("[name]")].map(({ name, value }) => [name, value]));
  let cleanSettings = settingsSnapshot();

  function closeGallery() {
    galleryRequest?.abort();
    gallery.hidden = true;
    templateButton.setAttribute("aria-expanded", "false");
  }

  function loadSettings(saved) {
    const { grid, page } = saved;
    const projected = grid.iso ?? (grid.style === "iso");
    const patterns = { line: "solid", dash32: "dash-1", dash16: "dash-2", dash12: "dash-3",
      dash8: "dash-4", dash: "dash-4", dash4: "dash-8", dash2: "dash-16", corner: "corners" };
    const values = {
      template: saved.template ?? saved.name, title: saved.title ?? "TTRPG Battle Map",
      overview: saved.overview ? "1" : "0", wid: saved.worldWidthFeet,
      gstyle: grid.style === "hex" ? "hex" : "rect", giso: projected,
      gangle: grid.isoAngleDegrees ?? "", grot: grid.rotationDegrees, gx: grid.offsetX, gy: grid.offsetY,
      gscale: grid.inchesPerFiveFeet, gline: Object.hasOwn(patterns, grid.lineStyle) ? patterns[grid.lineStyle] : grid.lineStyle,
      gcolor: grid.color, gpt: grid.lineWidthPoints, gopacity: grid.opacity,
      psize: page.size, porient: page.orientation, pr: page.rows, pc: page.columns,
      pmargin: page.marginInches, poverlap: page.overlapInches,
    };
    for (const [key, value] of Object.entries(values)) {
      const control = form.elements[key];
      const displayed = String(value);
      if (control instanceof HTMLSelectElement && ![...control.options].some((option) => option.value === displayed)) {
        control.add(new Option(displayed, displayed));
      }
      control.value = displayed;
    }
    updateAngle();
    loadedValues = values;
    cleanSettings = settingsSnapshot();
  }

  templateButton.addEventListener("click", async () => {
    closeGallery();
    galleryRequest = new AbortController();
    const { signal } = galleryRequest;
    const endpoint = new URL("/templates", renderEndpoint());
    templateButton.setAttribute("aria-expanded", "true");
    gallery.hidden = false;
    gallery.replaceChildren();
    preview.hidden = true;
    empty.hidden = true;
    download.hidden = true;
    status.textContent = "Loading templates…";
    try {
      const response = await fetch(endpoint, { signal });
      if (!response.ok) throw new Error("Could not load templates (HTTP " + response.status + ").");
      const templates = await response.json();
      if (signal.aborted) return;
      for (const { alias, name, dimensions } of templates) {
        const card = document.createElement("button");
        card.type = "button";
        card.setAttribute("aria-pressed", "false");
        const itemUrl = new URL("/templates/" + encodeURIComponent(alias), endpoint);
        const thumbnail = document.createElement("img");
        thumbnail.alt = "";
        thumbnail.loading = "lazy";
        thumbnail.src = itemUrl.href + "/preview.svg";
        const caption = document.createElement("span");
        caption.className = "gallery-caption";
        const label = document.createElement("span");
        label.textContent = name;
        caption.append(label);
        if (dimensions) {
          const details = document.createElement("span");
          details.className = "gallery-dimensions";
          details.textContent = dimensions;
          caption.append(details);
        }
        card.append(thumbnail, caption);
        gallery.append(card);
        card.addEventListener("click", async () => {
          if (settingsSnapshot() !== cleanSettings && !confirm("Replace the current settings with " + name + "?")) return;
          const snapshot = settingsSnapshot();
          for (const item of gallery.children) item.disabled = true;
          try {
            const response = await fetch(itemUrl, { signal });
            if (!response.ok) throw new Error("Could not load " + name + " (HTTP " + response.status + ").");
            const saved = await response.json();
            if (signal.aborted || (snapshot !== settingsSnapshot() && !confirm("Replace the settings you just changed?"))) return;
            loadSettings(saved);
            for (const item of gallery.children) item.setAttribute("aria-pressed", String(item === card));
            status.textContent = "Loaded " + name;
          } catch (error) {
            if (!signal.aborted) status.textContent = error.message;
          } finally {
            if (!signal.aborted) for (const item of gallery.children) item.disabled = false;
          }
        });
      }
      status.textContent = "Saved templates. Select one to load its settings.";
    } catch (error) {
      if (!signal.aborted) status.textContent = error.message;
    }
  });

  renderer.addEventListener("change", () => {
    if (!gallery.hidden) templateButton.click();
  });

  for (const helpButton of document.querySelectorAll("[data-help]")) {
    helpButton.addEventListener("click", () => {
      closeGallery();
      preview.src = new URL(helpButton.dataset.help, renderEndpoint()).href;
      preview.title = helpButton.textContent;
      preview.hidden = false;
      empty.hidden = true;
      download.hidden = true;
      status.textContent = helpButton.textContent;
      if (pdfUrl) {
        URL.revokeObjectURL(pdfUrl);
        pdfUrl = undefined;
      }
    });
  }

  function updateAngle() {
    angle.disabled = iso.value === "false";
    angle.required = !angle.disabled;
    if (!angle.disabled && !angle.value) angle.value = "60";
  }
  iso.addEventListener("change", updateAngle);
  updateAngle();

  function decimal(value) {
    const [mantissa, exponent] = value.toLowerCase().split("e");
    if (exponent === undefined) return value;
    const sign = mantissa.startsWith("-") ? "-" : "";
    const [whole, fraction = ""] = mantissa.slice(sign.length).split(".");
    const digits = whole + fraction;
    const point = whole.length + Number(exponent);
    if (point <= 0) return sign + "0." + "0".repeat(-point) + digits;
    if (point >= digits.length) return sign + digits.padEnd(point, "0");
    return sign + digits.slice(0, point) + "." + digits.slice(point);
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    // Keep exact stored values and the bundled 1/8-inch overlap usable.
    const constraints = [];
    for (const input of form.querySelectorAll('input[type="number"]:enabled')) {
      if (input.name === "poverlap" || input.value === String(loadedValues[input.name])) {
        constraints.push([input, input.min, input.max, input.step]);
        if (input.value === String(loadedValues[input.name])) input.min = input.max = "";
        input.step = "any";
      }
    }
    const valid = form.reportValidity();
    for (const [input, min, max, step] of constraints) {
      input.min = min;
      input.max = max;
      input.step = step;
    }
    if (!valid) return;
    const formValues = new FormData(form);
    const upload = new FormData();
    const image = document.querySelector("#image").files[0];
    upload.append("image", image);
    const params = new URLSearchParams(formValues);
    for (const input of form.querySelectorAll('input[type="number"]:enabled')) {
      params.set(input.name, decimal(input.value));
    }
    if (iso.value === "false") params.set("gangle", "null");
    const fileName = image.name.replace(/\.[^.]+$/, "") + ".pdf";
    button.disabled = true;
    status.textContent = "Rendering…";
    try {
      const response = await fetch(renderEndpoint() + "?" + params, { method: "POST", body: upload });
      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(error.error || "Render failed (HTTP " + response.status + ").");
      }
      if (!response.headers.get("Content-Type")?.startsWith("application/pdf")) {
        throw new Error("The renderer returned an unexpected response.");
      }
      const nextPdfUrl = URL.createObjectURL(await response.blob());
      if (pdfUrl) URL.revokeObjectURL(pdfUrl);
      pdfUrl = nextPdfUrl;
      closeGallery();
      preview.src = pdfUrl;
      preview.title = "Rendered map PDF";
      preview.hidden = false;
      empty.hidden = true;
      download.href = pdfUrl;
      download.download = fileName;
      download.hidden = false;
      status.textContent = "PDF ready";
    } catch (error) {
      status.textContent = error instanceof TypeError ? "Could not reach the renderer. Check that the selected endpoint is running and allows browser requests." : error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</html>
